name: Release

# Merging to main publishes every channel — but only when the version in the
# root package.json has changed. The git tag is the record of what has already
# shipped, so a push that does not bump the version is a no-op, and a re-run
# after a partial failure resumes rather than duplicating.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Should this push release?
        id: gate
        env:
          # Secrets are not readable in an `if:` condition, so they are checked
          # here. A repository without them skips cleanly rather than failing
          # every push for a reason nobody needs to investigate.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The Marketplace is optional. Its credential lives in a different
          # system from everything else here, and waiting on it would hold up
          # the two channels that are ready. Without VSCE_PAT the extension is
          # simply left to be uploaded by hand, as it was for 0.1.0.
          if [ -n "$VSCE_PAT" ]; then
            echo "marketplace=true" >> "$GITHUB_OUTPUT"
          else
            echo "marketplace=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VSCE_PAT is not set — publishing npm and tagging, but not the Marketplace. Upload the vsix from the CI artifact."
          fi

          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set — skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.gate.outputs.release == 'true'
      - run: npm ci --prefix mcp
        if: steps.gate.outputs.release == 'true'

      # Belt and braces: CI already checks this, but publishing a stale bundle
      # is not something to find out about afterwards.
      - name: Rebuild and verify nothing is stale
        if: steps.gate.outputs.release == 'true'
        run: |
          npm run compile:all
          git diff --exit-code || { echo "::error::Build output is stale."; exit 1; }

      - name: Publish @iamrobins/lore-mcp to npm
        if: steps.gate.outputs.release == 'true'
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${{ steps.gate.outputs.version }}
          # Idempotent, so a re-run after a later step failed does not error out.
          if npm view "@iamrobins/lore-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@iamrobins/lore-mcp@$VERSION is already on npm — skipping."
          else
            npm publish --access public
          fi

      - name: Publish the extension to the VS Code Marketplace
        if: steps.gate.outputs.release == 'true' && steps.gate.outputs.marketplace == 'true'
        run: npx --yes @vscode/vsce publish --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Uploadable by hand from the run's artifacts when the Marketplace step
      # was skipped, so a release is never blocked on that one credential.
      - name: Package the extension for manual upload
        if: steps.gate.outputs.release == 'true' && steps.gate.outputs.marketplace != 'true'
        run: npx --yes @vscode/vsce package --out lore.vsix

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.release == 'true' && steps.gate.outputs.marketplace != 'true'
        with:
          name: lore-vsix-v${{ steps.gate.outputs.version }}
          path: lore.vsix

      # The plugin ships as the repository itself, so there is nothing to upload.
      # Tagging is what marks the version as released, and what stops the next
      # push to main from publishing it again.
      - name: Tag the release
        if: steps.gate.outputs.release == 'true'
        run: |
          VERSION=${{ steps.gate.outputs.version }}
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.gate.outputs.version }}
          # The vsix is attached when the Marketplace step was skipped, so the
          # manual upload is a download from the release page rather than a dig
          # through the run's artifacts — and it is provably the same build the
          # rest of the release came from.
          if [ -f lore.vsix ]; then
            mv lore.vsix "lore-$VERSION.vsix"
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes "lore-$VERSION.vsix"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
